name: DuoSound
options:
  bundleIdPrefix: com.duosound
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic

targets:
  DuoSound:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: DuoSound
        excludes:
          - "**/*.plist"
    resources:
      - DuoSound/Assets.xcassets
    info:
      path: DuoSound/Info.plist
      properties:
        CFBundleName: DuoSound
        CFBundleDisplayName: DuoSound
        CFBundleIdentifier: com.duosound.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "© 2026 DuoSound"
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duosound.app
        PRODUCT_NAME: DuoSound
        INFOPLIST_FILE: DuoSound/Info.plist
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
      debug:
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        DEBUG_INFORMATION_FORMAT: dwarf
      release:
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
